name: AITP CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    name: Validate Schemas, Examples, and Conformance Fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-kat.txt

      - name: Install python-ecdsa (hash-pinned) for the independent KAT recompute
        run: python -m pip install --require-hashes -r scripts/requirements-kat.txt

      - name: make validate (schemas, examples, fixtures, both known-answer checkers, doc coherence)
        run: make validate

      - name: Check for release junk (.DS_Store, __MACOSX)
        run: |
          set -e
          junk_files=$(find . -name .DS_Store -not -path './.git/*' || true)
          junk_dirs=$(find . -name __MACOSX -type d -not -path './.git/*' || true)
          if [ -n "$junk_files" ] || [ -n "$junk_dirs" ]; then
            echo "::error::Release junk found in repository:"
            [ -n "$junk_files" ] && echo "$junk_files"
            [ -n "$junk_dirs" ] && echo "$junk_dirs"
            exit 1
          fi
          echo "✓ No .DS_Store or __MACOSX entries found"

      - name: Release dry-run (git archive of tracked files; backstop content check)
        run: |
          set -e
          make release RELEASE_VERSION=ci-dryrun
          archive="../agentidentitytrustprotocol-ci-dryrun.zip"
          if [ ! -f "$archive" ]; then
            echo "::error::Release archive not produced at $archive"
            exit 1
          fi
          echo "── Archive contents ──"
          unzip -l "$archive"
          # `make release` uses `git archive`, so only tracked files can be in
          # the zip. This grep is a backstop: it fails if junk ever gets
          # *committed* (or if the target stops using git archive).
          echo "── Backstop: no VCS metadata, OS junk, caches, env files or local scratch ──"
          if unzip -Z1 "$archive" | grep -E '(^|/)(\.git/|\.DS_Store$|__MACOSX/|__pycache__/|\.env($|\.)|node_modules/|temp/|plans/|\.claude/|CLAUDE\.md$|PROGRESS\.md$|ASSUMPTIONS\.md$)'; then
            echo "::error::Release archive contains paths that must never be released"
            exit 1
          fi
          echo "✓ Archive contains tracked files only, none on the backstop list"
          rm -f "$archive"

      - name: Summary
        run: |
          echo "✓ All AITP v0.3 validations passed"
          echo "  - JSON Schemas valid"
          echo "  - JSON examples valid"
          echo "  - Conformance fixtures + KAT vectors valid"
          echo "  - Every pinned canonical byte sequence and signature verified"
          echo "  - Known answers recomputed again by the independent Python checker"
          echo "  - Doc coherence (stages in scripts/check-doc-coherence.sh; the sibling-repo existence/anchor sub-check is local-only, skipped in CI)"
          echo "  - No release junk in tree"
          echo "  - Release archive (git archive, tracked files only) dry-run clean"

  handoff-scripts:
    name: Handoff scripts (shellcheck, syntax, read-only dry-run)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck scripts/handoff/*.sh

      - name: bash -n
        run: for f in scripts/handoff/*.sh; do bash -n "$f"; done

      # The job token is read-only and cannot see admin-only settings (private
      # vulnerability reporting, org variables); the dry-run marks those `?`.
      - name: org-settings.sh --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/handoff/org-settings.sh --dry-run
