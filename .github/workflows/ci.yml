name: AITP CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    name: Validate Schemas, Examples, and Conformance Fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate JSON Schemas (meta)
        run: |
          chmod +x scripts/validate-json-schema.sh
          ./scripts/validate-json-schema.sh

      - name: Validate JSON examples and conformance fixtures
        run: |
          chmod +x scripts/validate-json.sh
          ./scripts/validate-json.sh

      - name: Check for release junk (.DS_Store, __MACOSX)
        run: |
          set -e
          junk_files=$(find . -name .DS_Store -not -path './.git/*' || true)
          junk_dirs=$(find . -name __MACOSX -type d -not -path './.git/*' || true)
          if [ -n "$junk_files" ] || [ -n "$junk_dirs" ]; then
            echo "::error::Release junk found in repository:"
            [ -n "$junk_files" ] && echo "$junk_files"
            [ -n "$junk_dirs" ] && echo "$junk_dirs"
            exit 1
          fi
          echo "✓ No .DS_Store or __MACOSX entries found"

      - name: Release dry-run (verify archive contents)
        run: |
          set -e
          make release RELEASE_VERSION=ci-dryrun
          archive="../agentidentitytrustprotocol-ci-dryrun.zip"
          if [ ! -f "$archive" ]; then
            echo "::error::Release archive not produced at $archive"
            exit 1
          fi
          echo "── Archive contents ──"
          unzip -l "$archive"
          echo "── Verifying excluded paths are absent ──"
          if unzip -l "$archive" | grep -E '(\.git/|\.DS_Store|__MACOSX|/temp/|/\.claude/|/CLAUDE\.md|/plans/|/node_modules/)'; then
            echo "::error::Release archive contains excluded paths"
            exit 1
          fi
          echo "✓ Archive excludes all sanctioned-exclusion paths"
          rm -f "$archive"

      - name: Summary
        run: |
          echo "✓ All AITP v0.1 validations passed"
          echo "  - JSON Schemas valid"
          echo "  - JSON examples valid"
          echo "  - Conformance fixtures + KAT vectors valid"
          echo "  - No release junk in tree"
          echo "  - Release archive dry-run clean"
