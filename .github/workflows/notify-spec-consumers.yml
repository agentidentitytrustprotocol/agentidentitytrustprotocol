name: Notify spec consumers

# On a conformance-relevant change to the spec, dispatch `spec-released {sha}`
# to every repo that pins the spec by git SHA (CONTRIBUTING.md "Consuming the
# spec"; the consumer table is in docs/ecosystem.md):
#   - aitp-rs pins it in tests/schemas/SPEC_VERSION.
#   - aitp-verifier-py pins it in SPEC_VERSION once VP1.1 lands its
#     bump-spec.yml. Until then the dispatch reaches a repo with no listener
#     and is a no-op; its floating-`main` cron stays as a non-blocking canary.
#
# The consumer's bump-spec.yml calls aitp-ci/bump-spec-ref, which opens a HELD
# PR (never auto-merged): adopting a new spec is a deliberate review decision,
# and the PR's own conformance CI runs against the new fixtures.
#
# Auth: the aitp-deps-bot GitHub App (org secrets AITP_BOT_APP_ID /
# AITP_BOT_PRIVATE_KEY) — a short-lived installation token, no PAT.

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'rfcs/**'
      - 'registries/**'
      - 'docs/**'
      - 'scripts/**'
      - 'Makefile'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (scoped to the consumers)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AITP_BOT_APP_ID }}
          private-key: ${{ secrets.AITP_BOT_PRIVATE_KEY }}
          owner: agentidentitytrustprotocol
          repositories: aitp-rs,aitp-verifier-py

      - name: Dispatch spec-released to aitp-rs
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          repository: agentidentitytrustprotocol/aitp-rs
          event-type: spec-released
          client-payload: '{"sha": "${{ github.sha }}"}'

      - name: Dispatch spec-released to aitp-verifier-py
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          repository: agentidentitytrustprotocol/aitp-verifier-py
          event-type: spec-released
          client-payload: '{"sha": "${{ github.sha }}"}'
