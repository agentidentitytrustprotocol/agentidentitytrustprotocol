name: Notify Website of Doc Changes

on:
  push:
    branches: [main]
    # aitp-website only republishes docs/rfcs/registries/schemas content — it
    # does not consume the conformance tooling. Deliberately narrower than
    # notify-spec-consumers.yml's path filter, which also includes
    # `scripts/**` and `Makefile` because aitp-rs pins that tooling; a
    # tooling-only change here (e.g. scripts/zip-source.sh) has nothing for
    # the website to pick up, so don't dispatch on it.
    paths:
      - 'docs/**'
      - 'rfcs/**'
      - 'registries/**'
      - 'schemas/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (scoped to aitp-website)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AITP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AITP_BOT_PRIVATE_KEY }}
          owner: agentidentitytrustprotocol
          repositories: aitp-website

      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          repository: agentidentitytrustprotocol/aitp-website
          event-type: docs-updated
